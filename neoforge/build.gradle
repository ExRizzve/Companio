plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

def targetJavaVersion = project.java_version.toInteger()
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

def currentJavaVersion = JavaVersion.current().majorVersion.toInteger()

java {
    toolchain.languageVersion = JavaLanguageVersion.of(
            currentJavaVersion >= targetJavaVersion ? currentJavaVersion : targetJavaVersion)
    withSourcesJar()
}

sourceSets.main.java.srcDir("../common/src/main/java")
sourceSets.main.resources.srcDir("../common/src/main/resources")
project.compat.split(',').each { name ->
    sourceSets.main.java.srcDir("../common/src/compat/${name.trim()}/java")
}

neoForge {
    version = project.neoforge_version

    validateAccessTransformers = true

    runs {
        client {
            client()
        }
    }

    mods {
        companio {
            sourceSet sourceSets.main
        }
    }
}

def neoforgeRange = project.neoforge_version.replaceAll('-.*$', '').replaceAll('\\.[^.]+$', '')

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "neoforge_range", neoforgeRange
    filteringCharset "UTF-8"

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "neoforge_range": neoforgeRange
    }
}

jar {
    archiveClassifier = 'neoforge'
    manifest {
        attributes(["Implementation-Version": project.version])
    }
    from("../LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}-neoforge" }
    }
}

tasks.named('sourcesJar') {
    archiveClassifier = 'neoforge-sources'
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-neoforge"
            from components.java
        }
    }

    repositories {

    }
}
